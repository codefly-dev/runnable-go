name: ci
on:
  push:
    branches: [ main ]
  # No branches filter: a pull request stacked on another branch runs the same
  # checks. With auto-merge-on-green enabled, a pull request with no checks is
  # indistinguishable from one that passed them.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The job reads the tree and reports; it writes nothing back to the repository.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
